<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema Patrimonial</title>
  <link rel="icon" type="image/png" href="assets/logo-facilitei.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="profile-nav nav-link" data-page="perfil" type="button" aria-label="Abrir meu perfil"><span id="profile-avatar" class="profile-avatar" aria-hidden="true">●</span><span class="profile-nav-copy"><strong id="profile-nav-name">Meu perfil</strong><small id="profile-nav-email">Conta e assinatura</small></span></button>
      <nav aria-label="Navegação principal">
        <button class="nav-link active" data-page="casas"><span>⌂</span> Patrimônios</button>
        <button class="nav-link" data-page="pagamentos"><span>◷</span> Pagamentos</button>
        <button class="nav-link" data-page="gastos"><span>◇</span> Gastos</button>
        <button class="nav-link" data-page="categorias"><span>☷</span> Categorias</button>
        <button class="nav-link" data-page="documentos"><span>▤</span> Documentos</button>
        <button class="nav-link" data-page="assinaturas"><span>◈</span> Assinaturas</button>
        <button class="nav-link" data-page="contabilidade"><span>▦</span> Contabilidade</button>
        <button class="nav-link" data-page="relatorios"><span>▤</span> Relatórios</button>
      </nav>
      <button class="nav-link settings-nav" data-page="configuracoes" type="button"><span aria-hidden="true">⚙</span> Configurações</button>
      <button class="nav-link admin-nav hidden" data-page="admin" type="button"><span aria-hidden="true">▣</span> Admin</button>
      <button class="nav-link support-nav" data-page="suporte" type="button"><span aria-hidden="true">?</span> Suporte</button>
      <button id="sign-out-sidebar" class="nav-link sign-out-sidebar" type="button"><span>↪</span> Sair da conta</button>
    </aside>
    <main class="content">
      <header class="topbar"><button class="menu-toggle" aria-label="Abrir menu">☰</button><div id="breadcrumb">Visão geral</div><div class="topbar-actions"><div class="today" id="today"></div><button id="sign-out" class="sign-out hidden" type="button">Sair</button></div></header>
      <div id="app" class="page"></div>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="config.public.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="billing.js"></script>
  <script src="app.js"></script>
  <script src="responsive.js"></script>
</body>
</html>
